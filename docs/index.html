<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fintool 쇼케이스</title>
<meta name="description" content="같은 재무 문제를 Opus·Sonnet·Haiku에서 플러그인 없이/있이 실제로 돌린 대화 기록. Claude Desktop처럼 재생한다.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%230C6B52%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-size=%2718%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27monospace%27%3Ef%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --paper:#F5F7F6;--card:#FFFFFF;--ink:#132420;--muted:#5C6B66;--green:#0C6B52;--green-soft:#E3EFEA;
    --bear:#BC4A2E;--bear-soft:#F6E7E1;--line:#D8DFDC;--line-strong:#132420;--code:#EEF2F0;--side:#EFF2F1;--user-bg:#E9EEEC;
    --shadow:0 18px 60px rgba(19,36,32,.12);color-scheme:light;
  }
  :root[data-theme="dark"]{
    --paper:#0F1715;--card:#162220;--ink:#E6EFEB;--muted:#93A39D;--green:#5FC9A5;--green-soft:#17342B;
    --bear:#E88A6E;--bear-soft:#3A221B;--line:#273632;--line-strong:#E6EFEB;--code:#1E2B28;--side:#121C1A;--user-bg:#1C2926;
    --shadow:0 18px 60px rgba(0,0,0,.38);color-scheme:dark;
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --paper:#0F1715;--card:#162220;--ink:#E6EFEB;--muted:#93A39D;--green:#5FC9A5;--green-soft:#17342B;
    --bear:#E88A6E;--bear-soft:#3A221B;--line:#273632;--line-strong:#E6EFEB;--code:#1E2B28;--side:#121C1A;--user-bg:#1C2926;
  }}
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{background:var(--paper);color:var(--ink);font-family:'Avenir Next','Noto Sans KR','Apple SD Gothic Neo',sans-serif;font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased;}
  code,pre,.mono{font-family:'IBM Plex Mono','SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums;}
  code{background:var(--code);padding:1px 5px;border-radius:3px;font-size:.92em;word-break:break-all;}
  a{color:var(--green);}
  button{font-family:inherit;cursor:pointer;}
  button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid color-mix(in srgb,var(--green) 38%,transparent);outline-offset:2px;}
  button:disabled{cursor:default;}
  .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

  .app{display:grid;grid-template-columns:270px 1fr;height:100vh;}
  /* 사이드바 */
  .side{background:var(--side);border-right:1px solid var(--line);overflow-y:auto;padding:14px 0 40px;z-index:20;}
  .brand{font-weight:700;padding:6px 18px 14px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;}
  .brand small{font-weight:400;color:var(--muted);font-size:11.5px;}
  .side .home{display:block;width:calc(100% - 24px);margin:0 12px 14px;padding:8px 12px;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;font-size:13px;}
  .side .home.active{border-color:var(--green);color:var(--green);}
  .grp{font-size:11px;letter-spacing:.12em;color:var(--muted);padding:12px 18px 5px;}
  .conv{width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:7px 18px;font-size:13.5px;display:flex;align-items:center;gap:8px;}
  .conv:hover{background:var(--card);}
  .conv.active{background:var(--card);box-shadow:inset 3px 0 0 var(--green);font-weight:500;}
  .conv .dots{display:flex;gap:3px;flex:0 0 auto;}
  .conv .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:transparent;border:1px solid var(--muted);}
  .conv .dot.ok{background:var(--green);} .conv .dot.no{background:var(--bear);}
  .conv .n{margin-left:auto;font-size:11px;color:var(--muted);}

  /* 본문 */
  .main{display:flex;flex-direction:column;overflow:hidden;}
  .bar{display:flex;align-items:center;gap:10px;padding:11px 22px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap;}
  .bar .title{font-weight:700;font-size:14.5px;}
  .bar .sub{font-size:12px;color:var(--muted);}
  .spacer{margin-left:auto;}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;padding:0;min-inline-size:0;}
  .seg button{border:0;background:var(--card);color:var(--muted);padding:5px 11px;font-size:12.5px;}
  .seg button+button{border-left:1px solid var(--line);}
  .seg button.on{background:var(--ink);color:var(--paper);}
  .toggle{display:none;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:4px 10px;background:var(--card);font-size:12.5px;color:var(--muted);}
  .toggle .sw{width:34px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background .15s;}
  .toggle .sw i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--card);transition:left .15s;}
  .toggle.on{color:var(--green);border-color:var(--green);}
  .toggle.on .sw{background:var(--green);} .toggle.on .sw i{left:18px;}
  .theme{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:5px 10px;font-size:12px;}

  .scroll{flex:1;overflow-y:auto;scrollbar-gutter:stable;}
  .thread{max-width:760px;margin:0 auto;padding:26px 24px 40px;}
  .runmeta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:11.5px;color:var(--muted);font-family:'IBM Plex Mono',Menlo,monospace;padding-bottom:14px;margin-bottom:20px;border-bottom:1px dashed var(--line);}
  .runmeta b{color:var(--ink);font-weight:500;}
  .runmeta .ok{color:var(--green);} .runmeta .no{color:var(--bear);}

  .umsg{background:var(--user-bg);border-radius:12px;padding:13px 16px;margin:26px 0 18px;white-space:pre-wrap;font-size:14.5px;}
  .amsg{font-size:14.5px;}
  .amsg h1,.amsg h2,.amsg h3,.amsg h4,.amsg h5{font-size:15.5px;font-weight:700;margin:18px 0 7px;}
  .amsg p{margin:10px 0;}
  .amsg ul,.amsg ol{margin:8px 0 8px 20px;} .amsg li{margin:3px 0;}
  .amsg blockquote{border-left:3px solid var(--green);margin:12px 0;padding:2px 0 2px 14px;color:var(--muted);}
  .amsg hr{border:0;border-top:1px solid var(--line);margin:16px 0;}
  .amsg table{width:100%;border-collapse:collapse;font-size:13px;margin:11px 0;display:block;overflow-x:auto;}
  .amsg th,.amsg td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;}
  .amsg th:first-child,.amsg td:first-child{text-align:left;}
  .amsg thead th{font-weight:500;color:var(--muted);border-bottom:2px solid var(--line-strong);}
  .amsg pre{background:var(--code);padding:10px 12px;border-radius:6px;font-size:12px;white-space:pre-wrap;word-break:break-all;margin:10px 0;}
  .math{font-family:'Iowan Old Style','Palatino Linotype',serif;font-style:italic;white-space:nowrap;}
  .math-block{display:block;overflow-x:auto;background:var(--code);padding:10px 12px;border-radius:6px;margin:10px 0;text-align:center;}

  .think{font-size:12.5px;color:var(--muted);margin:12px 0;}
  .skill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;background:var(--green-soft);color:var(--green);padding:3px 10px;border-radius:5px;margin:12px 0;font-family:'IBM Plex Mono',Menlo,monospace;}

  .tool{border:1px solid var(--line);border-radius:8px;margin:12px 0;background:var(--card);overflow:hidden;}
  .tool.bad{border-color:var(--bear);}
  .tool>summary{list-style:none;cursor:pointer;padding:9px 13px;display:flex;align-items:center;gap:9px;font-size:12.5px;font-family:'IBM Plex Mono',Menlo,monospace;}
  .tool>summary::-webkit-details-marker{display:none;}
  .tool .nm{font-weight:500;}
  .tool .st{margin-left:auto;color:var(--green);}
  .tool.bad .st{color:var(--bear);}
  .tool .sz{color:var(--muted);font-size:11px;}
  .tbody{border-top:1px solid var(--line);padding:11px 13px;}
  .lbl{font-size:11px;letter-spacing:.1em;color:var(--muted);margin:8px 0 4px;}
  .lbl:first-child{margin-top:0;}
  .tbody pre{background:var(--code);padding:9px 11px;border-radius:5px;font-size:11.5px;white-space:pre-wrap;word-break:break-all;max-height:260px;overflow:auto;}
  .tbody table{width:100%;border-collapse:collapse;font-size:12px;}
  .tbody th,.tbody td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;}
  .tbody th:first-child,.tbody td:first-child{text-align:left;}
  .hash{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:11px;font-family:'IBM Plex Mono',Menlo,monospace;color:var(--muted);word-break:break-all;}
  .hash button{border:1px solid var(--line);background:var(--paper);color:var(--muted);border-radius:4px;padding:2px 7px;font-size:10.5px;flex:0 0 auto;}
  .err{color:var(--bear);font-size:12.5px;}

  .artifact{border:1px solid var(--line);border-radius:10px;margin:14px 0;background:var(--card);overflow:hidden;box-shadow:0 8px 28px rgba(19,36,32,.06);}
  .artifact-head{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);}
  .artifact-head strong{color:var(--ink);font-weight:600;}
  .artifact-head .ok{margin-left:auto;color:var(--green);}
  .artifact-preview{display:grid;grid-template-columns:88px minmax(0,1fr);gap:16px;align-items:center;padding:16px;}
  .artifact-sheet{height:108px;border:1px solid var(--line);border-radius:4px;background:linear-gradient(var(--green) 0 10px,transparent 10px),repeating-linear-gradient(180deg,transparent 0 14px,var(--line) 14px 15px);box-shadow:0 8px 20px rgba(19,36,32,.1);}
  .artifact-title{font-family:'Iowan Old Style','Noto Serif KR',serif;font-size:18px;line-height:1.35;margin-bottom:5px;}
  .artifact-meta{font-size:12px;color:var(--muted);}
  .artifact-open{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:6px 10px;font-size:12px;margin-top:10px;}

  dialog{width:min(760px,calc(100vw - 32px));max-height:calc(100vh - 48px);border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);box-shadow:var(--shadow);padding:0;}
  dialog::backdrop{background:rgba(7,16,13,.55);backdrop-filter:blur(2px);}
  .dialog-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);background:var(--card);}
  .dialog-head strong{font-family:'Iowan Old Style','Noto Serif KR',serif;font-size:18px;}
  .dialog-close{margin-left:auto;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:6px;padding:5px 9px;}
  .dialog-body{padding:18px;overflow:auto;}
  .dialog-body pre{white-space:pre-wrap;word-break:break-all;background:var(--code);padding:12px;border-radius:6px;font-size:11.5px;max-height:52vh;overflow:auto;}

  /* OFF/ON 좌우 비교 뷰 */
  .cmp{max-width:1560px;margin:0 auto;padding:0 22px 60px;}
  .cmp-head{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;padding:16px 0 12px;}
  .col-head{border:1px solid var(--line);border-radius:8px;background:var(--card);padding:9px 12px;min-width:0;}
  .col-head.on{border-color:var(--green);}
  .col-head .nm{display:flex;align-items:center;gap:7px;font-weight:600;font-size:13px;}
  .col-head.on .nm{color:var(--green);}
  .col-head .mark{width:8px;height:8px;border-radius:50%;flex:0 0 auto;border:1px solid var(--muted);}
  .col-head.on .mark{background:var(--green);border-color:var(--green);}
  .col-head .runmeta{padding:6px 0 0;margin:0;border:0;gap:3px 13px;font-size:11px;}

  .turn{padding-top:2px;}
  .turn+.turn{margin-top:30px;border-top:1px dashed var(--line);}
  .turn-n{position:sticky;top:var(--headh,72px);z-index:4;background:var(--paper);padding:14px 0 8px;font-family:'IBM Plex Mono',Menlo,monospace;font-size:11px;letter-spacing:.12em;color:var(--muted);}
  .turn-h{padding:8px 0 14px;}
  .turn-q{background:var(--user-bg);border-radius:12px;padding:13px 16px;white-space:pre-wrap;font-size:14.5px;}
  .panes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start;}
  .pane{min-width:0;}
  .pane .umsg{margin-top:0;}
  .nodata{color:var(--muted);font-size:13px;border:1px dashed var(--line);border-radius:8px;padding:14px;}

  /* 홈(카탈로그) */
  .home-view{max-width:1000px;margin:0 auto;padding:30px 24px 60px;}
  .home-view h1{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.3;}
  .home-view .lead{color:var(--muted);margin-top:12px;max-width:700px;}
  .matrix{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:8px;margin-top:22px;}
  .matrix th,.matrix td{padding:11px 13px;text-align:left;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top;}
  .matrix thead th{font-size:11px;letter-spacing:.08em;color:var(--muted);font-weight:500;border-bottom:2px solid var(--line-strong);}
  .matrix td.on{background:var(--green-soft);}
  :root[data-theme="dark"] .matrix td.on{background:rgba(95,201,165,.07);}
  .matrix .cellbtn{border:0;background:none;color:inherit;text-align:left;padding:0;font-size:13px;width:100%;border-radius:4px;}
  .matrix .cellbtn:hover b,.matrix .cellbtn:focus-visible b{color:var(--green);text-decoration:underline;text-underline-offset:3px;}
  .matrix .mini{font-size:11px;color:var(--muted);font-family:'IBM Plex Mono',Menlo,monospace;display:block;margin-top:3px;}
  .notes{margin:24px 0 0 18px;color:var(--ink);font-size:14px;}
  .notes li{margin:8px 0;}
  .tblwrap{overflow-x:auto;}

  .menu{display:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:5px 10px;font-size:12px;}
  .backdrop{display:none;}
  @media (max-width:1100px){
    .toggle{display:inline-flex;}
    .cmp{padding:0 18px 50px;}
    .cmp-head,.panes{grid-template-columns:minmax(0,1fr);}
    .cmp[data-pane="on"] [data-p="off"],.cmp[data-pane="off"] [data-p="on"]{display:none;}
  }
  @media (max-width:820px){
    .app{grid-template-columns:1fr;}
    .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:20;transform:translateX(-100%);transition:transform .18s;box-shadow:0 0 0 100vw rgba(0,0,0,0);}
    .side.open{transform:none;box-shadow:var(--shadow);}
    .backdrop{position:fixed;inset:0;z-index:19;border:0;background:rgba(0,0,0,.36);}
    .backdrop.on{display:block;}
    .menu{display:inline-block;}
    .thread{padding:20px 16px 32px;}
    .bar{padding:10px 14px;gap:8px;}
    .bar .sub{display:none;}
  }
  @media (max-width:520px){
    .bar{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;}
    .bar .title{grid-column:2;grid-row:1;max-width:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .bar .spacer{display:none;}
    .menu{grid-column:1;grid-row:1;}
    .theme{grid-column:3;grid-row:1;}
    .seg{grid-column:1 / 3;grid-row:2;width:100%;}
    .seg button{flex:1;padding:6px 5px;white-space:nowrap;}
    .toggle{grid-column:3;grid-row:2;}
    .toggle{padding:5px 8px;}
    .theme{width:34px;overflow:hidden;white-space:nowrap;padding:5px 8px;}
    .home-view{padding:24px 16px 44px;}
    .home-view h1{font-size:23px;}
    .matrix{min-width:520px;}
    .artifact-preview{grid-template-columns:70px minmax(0,1fr);padding:13px;gap:12px;}
    .artifact-sheet{height:92px;}
  }
  @media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important;}}
</style>

<div class="app">
  <nav class="side" id="side" aria-label="대화 목록">
    <div class="brand">fintool <small>쇼케이스</small></div>
    <button type="button" class="home active" id="homeBtn">← 전체 성적표</button>
    <div id="convList"></div>
  </nav>

  <div class="main">
    <div class="bar">
      <button type="button" class="menu" id="menuBtn" aria-label="대화 목록 열기" aria-expanded="false">☰</button>
      <span class="title" id="barTitle">전체 성적표</span>
      <span class="sub" id="barSub"></span>
      <span class="spacer"></span>
      <fieldset class="seg" id="modelSeg"><legend class="sr">모델 선택</legend></fieldset>
      <button type="button" class="toggle on" id="pluginBtn" aria-pressed="true"><span class="sw" aria-hidden="true"><i></i></span><span id="pluginLbl">플러그인 ON</span></button>
      <button type="button" class="theme" id="themeBtn" aria-label="색상 테마 전환">◐ <span>테마</span></button>
    </div>
    <div class="scroll" id="scroll"><div id="view"></div></div>
  </div>
</div>
<button type="button" class="backdrop" id="backdrop" aria-label="대화 목록 닫기"></button>
<dialog id="artifactDialog" aria-labelledby="artifactTitle">
  <div class="dialog-head"><strong id="artifactTitle">리포트</strong><button type="button" class="dialog-close" id="dialogClose">닫기</button></div>
  <div class="dialog-body" id="artifactBody"></div>
</dialog>

<script>
(function(){
  let DATA=null;
  let artifactEvents=[];
  let ignoreHashChange=false;
  let pendingTurn=0;
  const state={case:null,model:'opus',pane:'on'};
  const MODELS=[['opus','Opus 5'],['sonnet','Sonnet 5'],['haiku','Haiku 4.5']];
  const PANES=[['off','플러그인 OFF'],['on','플러그인 ON · fintool']];
  const $=function(id){return document.getElementById(id);};
  const esc=function(value){return String(value).replace(/[&<>]/g,function(char){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[char];});};

  function inline(value){
    let rendered=esc(value);
    rendered=rendered.replace(/`([^`]+)`/g,'<code>$1</code>');
    rendered=rendered.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    rendered=rendered.replace(/(?<![\w*])\*([^*\n]+?)\*(?![\w*])/g,'<em>$1</em>');
    rendered=rendered.replace(/\$(?=[^$\n]*[A-Za-z\\_^{}])([^$\n]+)\$/g,'<span class="math">$1</span>');
    return rendered;
  }

  function md(text){
    const lines=String(text||'').split('\n');
    const out=[];
    let i=0;
    while(i<lines.length){
      const line=lines[i];
      if(/^\s*```/.test(line)){
        const buffer=[];
        i+=1;
        while(i<lines.length&&!/^\s*```/.test(lines[i])){buffer.push(lines[i]);i+=1;}
        if(i<lines.length)i+=1;
        out.push('<pre>'+esc(buffer.join('\n'))+'</pre>');
        continue;
      }
      if(/^\s*\$\$/.test(line)){
        const math=[];
        let first=line.replace(/^\s*\$\$/,'');
        i+=1;
        if(/\$\$\s*$/.test(first)){
          math.push(first.replace(/\$\$\s*$/,''));
        }else{
          math.push(first);
          while(i<lines.length&&!/\$\$\s*$/.test(lines[i])){math.push(lines[i]);i+=1;}
          if(i<lines.length){math.push(lines[i].replace(/\$\$\s*$/,''));i+=1;}
        }
        out.push('<span class="math math-block">'+esc(math.join('\n'))+'</span>');
        continue;
      }
      if(/^\s*-{3,}\s*$/.test(line)){out.push('<hr>');i+=1;continue;}
      if(line.indexOf('|')===0&&i+1<lines.length&&/^\|[\s:|-]+\|/.test(lines[i+1])){
        const headers=line.replace(/^\||\|$/g,'').split('|').map(function(cell){return cell.trim();});
        const rows=[];
        i+=2;
        while(i<lines.length&&lines[i].indexOf('|')===0){rows.push(lines[i].replace(/^\||\|$/g,'').split('|').map(function(cell){return cell.trim();}));i+=1;}
        out.push('<table><thead><tr>'+headers.map(function(header){return '<th>'+inline(header)+'</th>';}).join('')+'</tr></thead><tbody>'+rows.map(function(row){return '<tr>'+row.map(function(cell){return '<td>'+inline(cell)+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>');
        continue;
      }
      const heading=line.match(/^(#{1,6})\s+(.*)/);
      if(heading){const level=Math.min(heading[1].length+1,5);out.push('<h'+level+'>'+inline(heading[2])+'</h'+level+'>');i+=1;continue;}
      if(/^\s*>\s?/.test(line)){
        const quote=[];
        while(i<lines.length&&/^\s*>\s?/.test(lines[i])){quote.push(lines[i].replace(/^\s*>\s?/,''));i+=1;}
        out.push('<blockquote>'+quote.map(inline).join('<br>')+'</blockquote>');
        continue;
      }
      if(/^\s*[-*]\s+/.test(line)){
        out.push('<ul>');
        while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){out.push('<li>'+inline(lines[i].replace(/^\s*[-*]\s+/,''))+'</li>');i+=1;}
        out.push('</ul>');
        continue;
      }
      if(/^\s*\d+\.\s+/.test(line)){
        out.push('<ol>');
        while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i])){out.push('<li>'+inline(lines[i].replace(/^\s*\d+\.\s+/,''))+'</li>');i+=1;}
        out.push('</ol>');
        continue;
      }
      if(!line.trim()){i+=1;continue;}
      const paragraph=[line];
      i+=1;
      while(i<lines.length&&lines[i].trim()&&!/^[|#>\-*`$]/.test(lines[i])&&!/^\s*\d+\.\s/.test(lines[i])){paragraph.push(lines[i]);i+=1;}
      out.push('<p>'+paragraph.map(inline).join('<br>')+'</p>');
    }
    return out.join('\n');
  }

  function fmt(value){
    if(typeof value==='number')return Math.abs(value)>=1000?value.toLocaleString('ko-KR',{maximumFractionDigits:2}):String(Math.round(value*1e6)/1e6);
    if(value===null)return '—';
    if(typeof value==='object')return JSON.stringify(value);
    return String(value);
  }

  function resultHTML(value){
    if(value===null||value===undefined)return '<p class="think">반환된 본문이 없다.</p>';
    if(typeof value!=='object')return '<pre>'+esc(String(value))+'</pre>';
    if(Array.isArray(value)){
      if(value.length&&value.every(function(row){return row&&typeof row==='object'&&!Array.isArray(row);})){
        const keys=Array.from(new Set(value.flatMap(function(row){return Object.keys(row);}))).slice(0,10);
        return '<table><thead><tr>'+keys.map(function(key){return '<th>'+esc(key)+'</th>';}).join('')+'</tr></thead><tbody>'+value.map(function(row){return '<tr>'+keys.map(function(key){return '<td>'+esc(fmt(row[key]))+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';
      }
      return '<pre>'+esc(JSON.stringify(value,null,2))+'</pre>';
    }
    const objectKeys=Object.keys(value);
    const nestedRows=objectKeys.filter(function(key){return value[key]&&typeof value[key]==='object'&&!Array.isArray(value[key]);});
    if(objectKeys.length>1&&nestedRows.length===objectKeys.length){
      const columns=Array.from(new Set(nestedRows.flatMap(function(key){return Object.keys(value[key]).filter(function(child){return value[key][child]===null||typeof value[key][child]!=='object';});}))).slice(0,10);
      if(columns.length){
        return '<table><thead><tr><th>항목</th>'+columns.map(function(column){return '<th>'+esc(column)+'</th>';}).join('')+'</tr></thead><tbody>'+nestedRows.map(function(key){return '<tr><td>'+esc(key)+'</td>'+columns.map(function(column){return '<td>'+esc(fmt(value[key][column]))+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';
      }
    }
    const flat=objectKeys.filter(function(key){return value[key]===null||typeof value[key]!=='object';});
    if(flat.length>=2){
      const rest=objectKeys.filter(function(key){return !flat.includes(key);});
      let html='<table><tbody>'+flat.map(function(key){return '<tr><td>'+esc(key)+'</td><td>'+esc(fmt(value[key]))+'</td></tr>';}).join('')+'</tbody></table>';
      if(rest.length){const remaining={};rest.forEach(function(key){remaining[key]=value[key];});html+='<pre>'+esc(JSON.stringify(remaining,null,2))+'</pre>';}
      return html;
    }
    return '<pre>'+esc(JSON.stringify(value,null,2))+'</pre>';
  }

  function runFor(caseId,plugin){return DATA.runs[caseId+'|'+state.model+'|'+plugin]||null;}
  function findCase(caseId){return DATA.cases.find(function(item){return item.id===caseId;})||null;}
  function sizeLabel(bytes){if(!bytes)return '';return bytes>=1024?(bytes/1024).toFixed(1)+'KB':bytes+'B';}
  function closeSide(){ $('side').classList.remove('open');$('backdrop').classList.remove('on');$('menuBtn').setAttribute('aria-expanded','false'); }

  function renderSide(){
    const groups=[];
    const byGroup={};
    DATA.cases.forEach(function(item){if(!byGroup[item.group]){byGroup[item.group]=[];groups.push(item.group);}byGroup[item.group].push(item);});
    $('convList').innerHTML=groups.map(function(group){
      return '<div class="grp">'+esc(group)+'</div>'+byGroup[group].map(function(item){
        const runs=PANES.map(function(pane){return runFor(item.id,pane[0]);});
        const dots=runs.map(function(run){return '<span class="dot '+(run&&run.ok===true?'ok':run&&run.ok===false?'no':'')+'"></span>';}).join('');
        const score=PANES.map(function(pane,index){const run=runs[index];return pane[1]+' '+(!run?'기록 없음':run.ok===true?'채점 통과':run.ok===false?'채점 실패':'채점 없음');}).join(' · ');
        const has=runs.some(Boolean);
        return '<button type="button" class="conv'+(state.case===item.id?' active':'')+'" data-case="'+item.id+'" aria-label="'+esc(item.title)+' · '+esc(score)+'"'+(has?'':' disabled style="opacity:.4"')+'><span class="dots" aria-hidden="true">'+dots+'</span><span>'+esc(item.title)+'</span>'+(item.turns>1?'<span class="n">'+item.turns+'턴</span>':'')+'</button>';
      }).join('');
    }).join('');
    $('homeBtn').className='home'+(state.case?'':' active');
    document.querySelectorAll('.conv').forEach(function(button){button.onclick=function(){state.case=button.dataset.case;render();if(window.innerWidth<=820)closeSide();};});
  }

  function renderBar(){
    $('modelSeg').innerHTML='<legend class="sr">모델 선택</legend>'+MODELS.map(function(model){return '<button type="button" data-m="'+model[0]+'" class="'+(state.model===model[0]?'on':'')+'" aria-pressed="'+(state.model===model[0])+'">'+model[1]+'</button>';}).join('');
    $('modelSeg').querySelectorAll('button').forEach(function(button){button.onclick=function(){state.model=button.dataset.m;render();};});
    $('pluginBtn').className='toggle'+(state.pane==='on'?' on':'');
    $('pluginBtn').setAttribute('aria-pressed',String(state.pane==='on'));
    $('pluginLbl').textContent=state.pane==='on'?'플러그인 ON':'플러그인 OFF';
    const selected=state.case?findCase(state.case):null;
    $('barTitle').textContent=selected?selected.title:'전체 성적표';
    $('barSub').textContent=selected?selected.summary:'';
  }

  function renderHome(){
    const rows=MODELS.map(function(model){
      const cells=['off','on'].map(function(condition){
        let pass=0;
        let total=0;
        let cost=0;
        let calls=0;
        let hashes=0;
        DATA.cases.forEach(function(item){const run=DATA.runs[item.id+'|'+model[0]+'|'+condition];if(!run)return;if(run.ok===true)pass+=1;if(run.ok!==null&&run.ok!==undefined)total+=1;cost+=run.usage.cost||0;calls+=run.calls||0;hashes+=run.hashes||0;});
        return '<td class="'+(condition==='on'?'on':'')+'"><button type="button" class="cellbtn" data-model="'+model[0]+'" data-plugin="'+condition+'"><b>'+(total?pass+'/'+total:'—')+'</b><span class="mini">$'+cost.toFixed(2)+' · 도구 '+calls+' · 해시 '+hashes+'</span></button></td>';
      }).join('');
      return '<tr><td><b>'+model[1]+'</b></td>'+cells+'</tr>';
    }).join('');
    $('view').innerHTML='<div class="home-view"><h1>같은 문제를 모델별로, 플러그인 없이/있이 전부 돌린 기록</h1><p class="lead">'+esc(DATA.meta.note)+' 왼쪽에서 대화를 고르면 플러그인 없이 돌린 실행과 fintool을 붙인 실행이 좌우로 나란히 재생된다. 위쪽 모델 세그먼트를 바꾸면 같은 질문의 다른 모델 실행으로 즉시 넘어간다.</p><div class="tblwrap"><table class="matrix"><thead><tr><th>모델</th><th>플러그인 없음</th><th class="on">fintool</th></tr></thead><tbody>'+rows+'</tbody></table></div><ul class="notes"><li>채점은 케이스마다 미리 정한 핵심 수치가 답변에 나오는지 기계적으로 확인한 결과다. 서술 품질은 채점하지 않는다.</li><li>응답 텍스트는 한 글자도 고치지 않았다. 표시되는 수치·해시는 전부 실행 결과에서 온 것이다.</li><li>수집 '+esc(DATA.meta.collected)+' · 플러그인 v'+esc(DATA.meta.plugin)+'</li></ul></div>';
    document.querySelectorAll('.cellbtn').forEach(function(button){button.onclick=function(){state.model=button.dataset.model;state.pane=button.dataset.plugin;const first=DATA.cases.find(function(item){return runFor(item.id,'on')||runFor(item.id,'off');});state.case=first?first.id:null;render();};});
  }

  function reportMeta(event){
    let spec={};
    let compose={};
    try{if(event.input&&typeof event.input.spec==='string')spec=JSON.parse(event.input.spec);}catch(error){spec={};}
    try{if(event.input&&typeof event.input.compose==='string')compose=JSON.parse(event.input.compose);}catch(error){compose={};}
    return {title:spec.meta&&spec.meta.title?spec.meta.title:'재무 리포트',recipe:event.input&&event.input.recipe?event.input.recipe:'finance-report',components:Array.isArray(compose.components)?compose.components:[]};
  }

  function artifactHTML(event){
    const index=artifactEvents.push(event)-1;
    const meta=reportMeta(event);
    return '<section class="artifact" aria-label="report 아티팩트"><div class="artifact-head"><span>▤</span><strong>report 아티팩트</strong><span>'+esc(meta.recipe)+'</span><span class="ok">✓ 생성</span></div><div class="artifact-preview"><div class="artifact-sheet" aria-hidden="true"></div><div><div class="artifact-title">'+esc(meta.title)+'</div><div class="artifact-meta">HTML 리포트 · '+esc(sizeLabel(event.bytes))+(meta.components.length?' · '+meta.components.length+'개 섹션':'')+'</div><button type="button" class="artifact-open" data-artifact="'+index+'">전체 보기</button></div></div></section>';
  }

  function eventHTML(event){
    if(event.t==='text')return '<div class="amsg">'+md(event.md)+'</div>';
    if(event.t==='thinking')return '<div class="think">✳ 잠시 생각함'+(event.ms?' · '+(event.ms/1000).toFixed(1)+'초':'')+'</div>';
    if(event.t==='skill')return '<div class="skill">✳ '+esc(event.name)+' 스킬 사용</div>';
    if(event.t!=='tool')return '';
    const bad=event.ok===false;
    if(!bad&&(event.name==='report'||event.name==='fintool_report'))return artifactHTML(event);
    const timing=event.ms?' · '+(event.ms/1000).toFixed(1)+'s':'';
    const head='<summary><span aria-hidden="true">⚙</span><span class="nm">'+esc(event.name)+'</span><span class="sz">'+esc(timing+(event.bytes?' · '+sizeLabel(event.bytes):''))+'</span><span class="st">'+(bad?'✗ 실패':'✓')+'</span></summary>';
    let body='<div class="tbody">';
    if(event.input&&Object.keys(event.input).length)body+='<div class="lbl">요청</div><pre>'+esc(JSON.stringify(event.input,null,2))+'</pre>';
    if(bad){body+='<div class="lbl">오류</div><div class="err">'+esc(event.error||'')+'</div>';if(event.contract)body+='<div class="lbl">엔진이 함께 준 입력 계약</div><pre>'+esc(JSON.stringify(event.contract,null,2))+'</pre>';}
    else if(event.persisted){body+='<div class="lbl">결과</div><div class="think">결과가 커서 파일로 저장됐다. 모델은 이 응답에서 값을 직접 읽지 못했다.</div>';}
    else if(event.result!==undefined){body+='<div class="lbl">결과</div>'+resultHTML(event.result);}
    if(event.hash)body+='<div class="hash"><span>'+esc(event.hash)+'</span><button type="button" data-h="'+esc(event.hash)+'">복사</button></div>';
    body+='</div>';
    return '<details class="tool'+(bad?' bad':'')+'">'+head+body+'</details>';
  }

  function openArtifact(index){
    const event=artifactEvents[index];
    if(!event)return;
    const meta=reportMeta(event);
    $('artifactTitle').textContent=meta.title;
    $('artifactBody').innerHTML='<p class="artifact-meta">'+esc(meta.recipe)+' · '+esc(sizeLabel(event.bytes))+'</p>'+(meta.components.length?'<p><strong>구성</strong><br>'+meta.components.map(esc).join(' · ')+'</p>':'')+'<p class="think">수집 원문에는 생성된 HTML 본문이 포함되지 않아 원문에 있는 아티팩트 메타데이터와 생성 요청만 표시한다.</p><details class="tool"><summary>생성 요청 원문</summary><div class="tbody"><pre>'+esc(JSON.stringify(event.input||{},null,2))+'</pre></div></details>';
    $('artifactDialog').showModal();
  }

  function bindThreadActions(){
    document.querySelectorAll('.hash button').forEach(function(button){button.onclick=function(){const original=button.textContent;if(!navigator.clipboard){button.textContent='복사 불가';return;}navigator.clipboard.writeText(button.dataset.h).then(function(){button.textContent='복사됨';setTimeout(function(){button.textContent=original;},1400);}).catch(function(){button.textContent='복사 실패';});};});
    document.querySelectorAll('.artifact-open').forEach(function(button){button.onclick=function(){openArtifact(Number(button.dataset.artifact));};});
  }

  function colHeadHTML(plugin,label,run){
    let meta;
    if(!run){
      meta='<div class="runmeta"><span>이 조합의 실행 기록이 없다</span></div>';
    }else{
      const usage=run.usage;
      meta='<div class="runmeta"><span><b>'+usage.sec+'s</b></span><span>출력 <b>'+(usage.out||0).toLocaleString()+'</b> tok</span><span><b>$'+(usage.cost||0).toFixed(3)+'</b></span>'+(run.calls?'<span>도구 <b>'+run.calls+'</b>'+(run.errors?' · <span class="no">오류 '+run.errors+'</span>':'')+'</span>':'')+(run.hashes?'<span class="ok">해시 '+run.hashes+'</span>':'')+(run.ok===true?'<span class="ok">채점 통과</span>':run.ok===false?'<span class="no">채점 실패</span>':'')+'</div>';
    }
    return '<div class="col-head'+(plugin==='on'?' on':'')+'" data-p="'+plugin+'"><div class="nm"><span class="mark" aria-hidden="true"></span>'+esc(label)+'</div>'+meta+'</div>';
  }

  function paneHTML(plugin,run,index,showUser){
    const turn=run?run.turns[index]:null;
    if(!turn){
      const note=run?'이 턴의 기록이 없다.':(index===0?'이 조합의 실행 기록이 아직 없다.':'');
      return '<div class="pane" data-p="'+plugin+'">'+(note?'<p class="nodata">'+note+'</p>':'')+'</div>';
    }
    return '<div class="pane" data-p="'+plugin+'">'+(showUser?'<div class="umsg">'+esc(turn.user)+'</div>':'')+turn.events.map(eventHTML).join('')+'</div>';
  }

  function renderCompare(){
    artifactEvents=[];
    const runs={off:runFor(state.case,'off'),on:runFor(state.case,'on')};
    if(!runs.off&&!runs.on){
      const model=MODELS.find(function(item){return item[0]===state.model;});
      $('view').innerHTML='<div class="thread"><p class="think">'+esc(model?model[1]:state.model)+'에서 이 케이스를 돌린 기록이 아직 없다.</p></div>';
      return;
    }
    const total=Math.max(runs.off?runs.off.turns.length:0,runs.on?runs.on.turns.length:0);
    const sections=[];
    for(let index=0;index<total;index+=1){
      const offTurn=runs.off?runs.off.turns[index]:null;
      const onTurn=runs.on?runs.on.turns[index]:null;
      const shared=offTurn&&onTurn?(offTurn.user===onTurn.user?offTurn.user:null):(offTurn||onTurn||{user:null}).user;
      const head=(total>1?'<div class="turn-n">턴 '+(index+1)+' / '+total+'</div>':'')+'<div class="turn-h">'+(shared===null?'':'<div class="turn-q">'+esc(shared)+'</div>')+'</div>';
      sections.push('<section class="turn" id="turn-'+(index+1)+'">'+head+'<div class="panes">'+PANES.map(function(pane){return paneHTML(pane[0],runs[pane[0]],index,shared===null);}).join('')+'</div></section>');
    }
    $('view').innerHTML='<div class="cmp" data-pane="'+state.pane+'"><div class="cmp-head">'+PANES.map(function(pane){return colHeadHTML(pane[0],pane[1],runs[pane[0]]);}).join('')+'</div>'+sections.join('')+'</div>';
    bindThreadActions();
    syncHeadOffset();
  }

  function syncHeadOffset(){
    const cmp=document.querySelector('.cmp');
    const head=cmp?cmp.querySelector('.cmp-head'):null;
    if(cmp&&head)cmp.style.setProperty('--headh',head.offsetHeight+'px');
  }

  function hashString(){
    const params=new URLSearchParams();
    params.set('case',state.case||'');
    params.set('model',state.model);
    return params.toString();
  }

  function syncHash(){
    const next=hashString();
    if(location.hash.slice(1)===next)return;
    ignoreHashChange=true;
    history.replaceState(null,'','#'+next);
    ignoreHashChange=false;
  }

  function readHash(){
    const params=new URLSearchParams(location.hash.replace(/^#/,''));
    const model=params.get('model');
    const plugin=params.get('plugin');
    const caseId=params.get('case');
    const turn=Number.parseInt(params.get('turn')||'0',10);
    state.model=MODELS.some(function(item){return item[0]===model;})?model:'opus';
    state.pane=plugin==='off'?'off':'on';
    state.case=caseId&&findCase(caseId)?caseId:null;
    pendingTurn=Number.isFinite(turn)&&turn>1?turn:0;
  }

  function render(options){
    const settings=options||{};
    renderBar();
    renderSide();
    if(state.case)renderCompare();else renderHome();
    if(!settings.keepScroll)$('scroll').scrollTop=0;
    if(pendingTurn){const anchor=document.getElementById('turn-'+pendingTurn);if(anchor)anchor.scrollIntoView({block:'start'});pendingTurn=0;}
    syncHash();
  }

  let savedTheme=null;
  try{savedTheme=localStorage.getItem('fintool-theme');}catch(error){savedTheme=null;}
  if(savedTheme==='light'||savedTheme==='dark')document.documentElement.setAttribute('data-theme',savedTheme);
  $('themeBtn').onclick=function(){const root=document.documentElement;const dark=root.getAttribute('data-theme')==='dark'||(!root.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme: dark)').matches);const next=dark?'light':'dark';root.setAttribute('data-theme',next);try{localStorage.setItem('fintool-theme',next);}catch(error){return;}};
  $('menuBtn').onclick=function(){const open=!$('side').classList.contains('open');$('side').classList.toggle('open',open);$('backdrop').classList.toggle('on',open);$('menuBtn').setAttribute('aria-expanded',String(open));};
  $('backdrop').onclick=closeSide;
  $('homeBtn').onclick=function(){state.case=null;render();if(window.innerWidth<=820)closeSide();};
  $('pluginBtn').onclick=function(){state.pane=state.pane==='on'?'off':'on';renderBar();const cmp=document.querySelector('.cmp');if(cmp)cmp.dataset.pane=state.pane;};
  $('dialogClose').onclick=function(){$('artifactDialog').close();};
  $('artifactDialog').addEventListener('click',function(event){if(event.target===$('artifactDialog'))$('artifactDialog').close();});
  window.addEventListener('resize',syncHeadOffset);
  window.addEventListener('hashchange',function(){if(ignoreHashChange||!DATA)return;readHash();render();});

  fetch('assets/conversations.json').then(function(response){if(!response.ok)throw new Error('HTTP '+response.status);return response.json();}).then(function(data){DATA=data;readHash();render();}).catch(function(error){$('view').innerHTML='<div class="home-view"><p>대화 데이터를 불러오지 못했다: '+esc(error.message)+'</p></div>';});
})();
</script>
